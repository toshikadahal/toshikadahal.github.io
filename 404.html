<script id="scrollTopButtonOnlyScript">
  (function () {
    var topButton = document.getElementById("scrollTopButtonOnly");

    function detectTheme() {
      var text = [
        document.documentElement.getAttribute("data-theme") || "",
        document.body.getAttribute("data-theme") || "",
        document.documentElement.className || "",
        document.body.className || ""
      ].join(" ").toLowerCase();

      if (text.indexOf("dark") !== -1) {
        return "dark";
      }

      if (text.indexOf("light") !== -1) {
        return "light";
      }

      var buttons = Array.prototype.slice.call(document.querySelectorAll("button, a, span, div"));
      var themeToggle = buttons.find(function (el) {
        var t = el.textContent ? el.textContent.trim().toUpperCase() : "";
        return t === "LIGHT" || t === "DARK";
      });

      if (themeToggle) {
        var label = themeToggle.textContent.trim().toUpperCase();
        if (label === "LIGHT") {
          return "dark";
        }
        if (label === "DARK") {
          return "light";
        }
      }

      var bg = window.getComputedStyle(document.body).backgroundColor;
      var nums = bg.match(/\d+/g);

      if (nums && nums.length >= 3) {
        var r = parseInt(nums[0], 10);
        var g = parseInt(nums[1], 10);
        var b = parseInt(nums[2], 10);
        var brightness = (r * 299 + g * 587 + b * 114) / 1000;
        return brightness < 128 ? "dark" : "light";
      }

      return "light";
    }

    function updateButtonTheme() {
      var theme = detectTheme();

      topButton.classList.remove("theme-light");
      topButton.classList.remove("theme-dark");

      if (theme === "dark") {
        topButton.classList.add("theme-dark");
      } else {
        topButton.classList.add("theme-light");
      }
    }

    function toggleTopButton() {
      var triggerPoint = Math.max(420, window.innerHeight * 0.65);

      if (window.scrollY > triggerPoint) {
        topButton.classList.add("show");
      } else {
        topButton.classList.remove("show");
      }

      updateButtonTheme();
    }

    topButton.addEventListener("click", function () {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    document.addEventListener("click", function () {
      setTimeout(updateButtonTheme, 100);
      setTimeout(updateButtonTheme, 400);
    });

    window.addEventListener("scroll", toggleTopButton, { passive: true });
    window.addEventListener("resize", toggleTopButton);

    setTimeout(toggleTopButton, 100);
    setTimeout(toggleTopButton, 700);
    toggleTopButton();
  })();
</script>
